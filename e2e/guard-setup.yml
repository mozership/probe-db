name: Tables for the guard

# The action as it was just built, by the name a workflow gives a released
# one.
actions:
  db: ./action

vars:
  dsn: "{{DSN}}"

jobs:
- name: Setup
  steps:
  - name: Create the table
    uses: db
    with:
      dsn: "{{vars.dsn}}"
      query: CREATE TABLE IF NOT EXISTS probe_guard (v INT)
    test: res.code == 0
  - name: Put one row in it
    uses: db
    with:
      dsn: "{{vars.dsn}}"
      query: INSERT INTO probe_guard VALUES (1)
    test: res.code == 0
