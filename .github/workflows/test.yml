name: Test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # Releases are built without cgo, which the SQLite of modernc.org does
      # without.
      - name: go test without cgo, as releases are built
        run: go test ./...
        env:
          CGO_ENABLED: "0"

  # The action run through Probe against SQLite, PostgreSQL and MySQL, and
  # again under --read-only, where a statement that writes is refused, and
  # one that hides a write is refused by the database.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: probe
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U probe"
          --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: mysql
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -ppassword -h127.0.0.1"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Probe resolves the action before the first job of a workflow, so it
      # is built first.
      - run: go build -o e2e/action/probe-db .
      # A workflow can give an external action the name db from v1.41.0.
      - name: Install Probe
        uses: mozership/probe-action@831b8b6c6aa0c8a61aa75b58f36a08da5c579e83 # v1.3.0
        with:
          install-only: true
          version: v1.41.0
      - run: probe e2e/sqlite.yml
      - run: probe e2e/postgres.yml
        env:
          POSTGRES_PORT: 15432
          POSTGRES_USER: probe
          POSTGRES_PASS: password
      - run: probe e2e/mysql.yml
        env:
          MYSQL_PORT: 13306
          MYSQL_PASS: password
      - name: PostgreSQL under --read-only
        run: |
          probe e2e/guard-setup.yml > /dev/null
          probe --read-only --allow-host localhost e2e/guard.yml
        env:
          DSN: postgres://probe:password@localhost:15432/postgres?sslmode=disable
          WRITE: WITH d AS (DELETE FROM probe_guard RETURNING *) SELECT count(*) FROM d
      - name: MySQL under --read-only
        run: |
          probe e2e/guard-setup.yml > /dev/null
          probe --read-only --allow-host localhost e2e/guard.yml
        env:
          DSN: mysql://root:password@localhost:13306/mysql
          WRITE: EXPLAIN ANALYZE UPDATE probe_guard SET v = 2

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # go fix rewrites code to what the Go version in go.mod has, such as
      # maps.Copy for a loop that copies a map. -diff prints the rewrites
      # instead of applying them, and fails when there is any: run go fix ./...
      # and commit what it changes.
      - name: go fix
        run: go fix -diff ./...

  # govulncheck fails on a vulnerability the code calls, in a module it
  # requires or in the standard library of the Go in go.mod, which releases
  # are built with: update the module, or the Go in go.mod.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
